name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      # v5 부터 Node 24 로 돈다. v4 로 두면 러너가 Node 20 폐기 경고를 낸다.
      # 러너는 v2.327.1 이상이어야 하는데 GitHub 호스티드 windows-latest 는 이미 넘는다.
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Get version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $parts = $version.Split('.')
          while ($parts.Count -lt 3) { $parts += '0' }
          $version = $parts -join '.'
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore CdsHelper/CdsHelper.csproj

      # 놀이만 띄우는 exe 도 같이 낸다 — 같은 폴더에 나란히 놓인다.
      - name: Restore (play)
        run: dotnet restore CdsHelper.Play/CdsHelper.Play.csproj

      - name: Publish
        run: dotnet publish CdsHelper/CdsHelper.csproj -c Release -o publish --no-restore -p:Version=${{ steps.version.outputs.version }} -p:AssemblyVersion=${{ steps.version.outputs.version }} -p:FileVersion=${{ steps.version.outputs.version }} -p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: Publish (play)
        run: dotnet publish CdsHelper.Play/CdsHelper.Play.csproj -c Release -o publish --no-restore -p:Version=${{ steps.version.outputs.version }} -p:AssemblyVersion=${{ steps.version.outputs.version }} -p:FileVersion=${{ steps.version.outputs.version }} -p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: Install vpk
        # CLI와 라이브러리(Velopack 0.0.1298) 버전 일치시켜 호환성 문제 회피
        run: dotnet tool install -g vpk --version 0.0.1298

      - name: Download previous release for delta updates
        shell: pwsh
        run: vpk download github --repoUrl https://github.com/Kyeongrok/cds-helper --token ${{ secrets.GITHUB_TOKEN }} --outputDir releases
        continue-on-error: true

      - name: Pack with Velopack
        # --mainExe: Velopack이 Setup.exe bootstrapper를 만들려면 entry point exe를 명시해야 함.
        #   누락 시 Setup.exe 생성이 skip되고 nupkg/RELEASES만 만들어짐.
        # --packTitle / --packAuthors: 설치 UI와 시작 메뉴 등에 표시되는 이름.
        run: vpk pack --packId CdsHelper --packTitle "CdsHelper" --packAuthors "Kyeongrok" --packVersion ${{ steps.version.outputs.version }} --packDir publish --mainExe CdsHelper.exe --outputDir releases --icon CdsHelper/app.ico

      - name: List releases folder (debug)
        shell: pwsh
        run: |
          Write-Host "=== releases 폴더 내용 ==="
          Get-ChildItem -Path releases -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          Write-Host "=== Setup.exe 존재 여부 ==="
          $setup = Get-ChildItem -Path releases -Filter "*Setup.exe" -Recurse
          if ($setup) { Write-Host "✓ Setup.exe 발견: $($setup.FullName)" } else { Write-Host "✗ Setup.exe 없음" }

      # 포터블 판 — 설치 없이 풀어 쓰는 벌이다. publish 폴더 "속"을 통째로 담으므로
      # 압축을 풀면 놀이 exe(CdsHelperPlay.exe)와 뷰어(CdsHelper.exe)가 맨 위에 바로 보인다.
      # 폴더째 담으면 한 겹이 더 들어가 exe 가 안 보인다.
      #
      # releases 밖(portable)에 짓는다 — vpk upload 가 releases 를 통째로 올리므로,
      # 그 안에 두면 Velopack 이 모르는 파일이 섞여 든다.
      - name: Make portable zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          if (-not (Test-Path publish/CdsHelperPlay.exe)) {
            throw "publish 에 CdsHelperPlay.exe 가 없습니다 - 놀이 exe 가 안 실렸습니다"
          }
          New-Item -ItemType Directory -Force portable | Out-Null
          Compress-Archive -Path publish/* -DestinationPath "portable/CdsHelper-$version-portable.zip" -CompressionLevel Optimal

      - name: Upload to GitHub Releases
        # --publish: draft가 아니라 정식 릴리즈로 업로드 (없으면 Setup.exe 포함 에셋이 전부 draft에 묻힘)
        # --merge: tag push로 자동 생성된 빈 릴리즈가 있으면 그쪽에 에셋을 병합
        run: vpk upload github --repoUrl https://github.com/Kyeongrok/cds-helper --token ${{ secrets.GITHUB_TOKEN }} --tag ${{ github.ref_name }} --releaseName "${{ github.ref_name }}" --outputDir releases --publish --merge

      # 포터블 zip 은 Velopack 이 모르는 덤이라 따로 붙인다. 릴리즈가 선 뒤라야 붙는다.
      - name: Upload portable zip
        shell: pwsh
        run: |
          $zip = (Get-ChildItem portable/*.zip)[0].FullName
          gh release upload "${{ github.ref_name }}" "$zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
